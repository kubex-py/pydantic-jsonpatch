[project]
name = "pydantic-jsonpatch"
dynamic = ["version"]
description = "JSON Patch (RFC6902) implementation for Pydantic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
maintainers = [
    {name = "Codemageddon", email = "dev@codemageddon.me"},
]
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-jsonpointer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://pydantic-jsonpatch.codemageddon.me/"
Repository = "https://github.com/kubex-py/pydantic-jsonpatch.git"
Issues = "https://github.com/kubex-py/pydantic-jsonpatch/issues"
Changelog = "https://github.com/kubex-py/pydantic-jsonpatch/blob/main/CHANGELOG.md"
Documentation = "https://pydantic-jsonpatch.codemageddon.me/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pydantic_jsonpatch/__version__.py"

[tool.mypy]
strict = true
plugins = [
    "pydantic.mypy"
]

[tool.uv.sources]
pydantic-jsonpointer = { path = "../pydantic-jsonpointer", editable = true }

[dependency-groups]
dev = [
    "mypy>=2,<3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]
